name: Browser regression tests

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    # Baselines were captured on Windows. Keep the OS and browser consistent.
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun install --cwd src --frozen-lockfile
      - run: bun --bun run playwright install chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
